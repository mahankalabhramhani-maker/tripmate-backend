# ===================================================
# TRIP MATE - PRODUCTION CONFIGURATION (RENDER / DOCKER)
# ===================================================

# Server Configuration (Render dynamically injects PORT; fallback 10000)
server.port=${PORT:10000}

# Application Name
spring.application.name=tripmate

# MySQL Database Configuration
# Provide DB_URL (or SPRING_DATASOURCE_URL), DB_USERNAME, and DB_PASSWORD in Render Environment Variables
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Engine Configuration
ai.api.key=${AI_API_KEY:}
ai.api.provider=${AI_PROVIDER:internal}
